<!DOCTYPE html>

<body>

              <div></div>

              <div></div>

            <span class="name">BIENVENIDOS A BELLEZA LATINA</span>
            <span class="lorem"><p align="left">Es un espacio dedicado a resaltar la belleza, cultura y estilo de la mujer latina. Nuestra misión es inspirar, empoderar y celebrar la diversidad de la belleza latina a través de consejos de moda, tendencias de maquillaje, cuidado de la piel y bienestar.</p>
              </span>
          </div>
          <a href="https://www.google.com.ec/maps/place/Universidad+T%C3%A9cnica+%22Luis+Vargas+Torres%22+de+Esmeraldas/@0.9739007,-79.6688605,17z/data=!3m1!4b1!4m6!3m5!1s0x8fd4bc1a30135aa3:0xe28151571fb3e66d!8m2!3d0.9739007!4d-79.6662856!16s%2Fg%2F121p62zn?hl=es&entry=ttu&g_ep=EgoyMDI1MDQwMS4wIKXMDSoJLDEwMjExNDUzSAFQAw%3D%3D" class="btn-contact">UBICACION</a>

            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-bookmark"></i>
            <i class="fa-solid fa-share-nodes"></i>
          </div>
        </div>
      </label>

      <label for="s2" id="slide2">
        <div class="card">
          <div class="image">
            <img src="img.webp" alt="enlatada">
            <div class="dots">
              <div class="dot1"></div>
              <div class="dot2"></div>
              <div class="dot3"></div>
            </div>
          </div>
          <div class="infos">
            <span class="name">LAPIZ LABIAL</span>
            <span class="lorem"><p align="left">¡Es bien sabido que la barra de labios es un producto de maquillaje imprescindible para cualquier amante de la belleza! Dependiendo del tono mágico, la fórmula y el acabado que escojas, la barra de labios tiene el poder de transformar tu look de maquillaje, mejorar tu estado de ánimo y retratar tu fabulosa personalidad: ¡desde un tono sutil y discreto hasta un impactante beso de color para dejar claras tus intenciones! </p></span>
          </div>
          <a href="https://www.charlottetilbury.com/es/secrets/beneficios-de-los-labiales?srsltid=AfmBOorzoN8y7XjRzRfyMDj9CKsQ1fpYIg1UTP9BqcX5DBWhpCW9a3AT" class="btn-contact">DETALLES</a>
          <div class="socials">
            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-bookmark"></i>
            <i class="fa-solid fa-share-nodes"></i>
          </div>
        </div>
      </label>

      <label for="s3" id="slide3">

            <span class="name">BASE DE MAQUILLAJE</span>
            <span class="lorem"><p align="left">Es uno de los productos esenciales en cualquier rutina de maquillaje. Su principal función es unificar el tono, cubrir imperfecciones y preparar la piel para el maquillaje. Una base puede mejorar al instante la apariencia de tu piel, haciendo que se sienta suave, radiante y sin imperfecciones.</p></span>
          </div>
          <a href="https://ateneaprofesional.com/blogs/blog-atenea/para-que-sirve-la-base-de-maquillaje?srsltid=AfmBOopi229rKySI6hfvXWcGPuJstt5al6hUJigVcg-HqzdBefIG1bdc" class="btn-contact">VENTAJAS</a>
          <div class="socials">
            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-bookmark"></i>
            <i class="fa-solid fa-share-nodes"></i>

        </div>

            <span class="name">PALETA DE POLVO DE RUBOR</span>

            <span class="name">CATALOGO</span>

          <div class="socials">
